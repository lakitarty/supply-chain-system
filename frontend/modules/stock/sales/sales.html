<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="../../../shared/css/base.css">
    <link rel="stylesheet" href="../../../shared/css/shell.css">
    <link rel="stylesheet" href="sales.css">
    <title>Sales &amp; Reports | Nexora MSRC</title>
</head>
<body>
    <div id="shell"></div>

    <main class="page stock-sales-page">
        <header class="stock-sales-heading">
            <div>

                <h1>Sales &amp; Reports</h1>

            </div>
            <div class="stock-sales-actions">
                <a class="secondary-button" href="../stock/stock.html">Manage stock</a>

            </div>
        </header>

        <div class="sales-report-workspace">
        <section class="stock-sales-toolbar" aria-label="Sales report filters">
            <div class="stock-sales-field">
                <label for="salesReportBranch">Branch</label>
                <select id="salesReportBranch"></select>
            </div>
            <div class="stock-sales-field">
                <label for="salesReportPeriod">Period</label>
                <select id="salesReportPeriod">
                    <option value="TODAY">Today</option>
                    <option value="LAST_7_DAYS">Last 7 days</option>
                    <option value="THIS_MONTH">This month</option>
                </select>
            </div>
        </section>

        <p id="salesReportStatus" class="stock-sales-status" role="status" aria-live="polite">Loading sales report...</p>
        <section id="salesReportMetrics" class="stock-sales-metrics" aria-label="Sales summary"></section>
        <section id="salesRevenueNotice" class="stock-sales-notice" hidden></section>

        <section class="stock-sales-table-section" aria-labelledby="salesBreakdownTitle">
            <header class="stock-sales-section-heading">
                <div>
                    <h2 id="salesBreakdownTitle">Sales breakdown</h2>
                    <p id="salesReportRange">Daily summaries for the selected period.</p>
                </div>
            </header>
            <div class="stock-sales-table-wrap">
                <table class="stock-sales-table">
                    <thead>
                        <tr>
                            <th>Branch</th>
                            <th>Product / package</th>
                            <th class="numeric">Units sold</th>
                            <th class="numeric">Amount entered (KSh)</th>
                            <th class="numeric">Tax calculated (KSh)</th>
                            <th class="numeric">Net sales (KSh)</th>
                            <th>Tax review</th>
                            <th class="numeric">Amount missing</th>
                        </tr>
                    </thead>
                    <tbody id="salesReportRows">
                        <tr><td colspan="8" class="stock-sales-empty">Loading sales records...</td></tr>
                    </tbody>
                </table>
            </div>
        </section>


        </div>
    </main>

    <script src="../../../shared/js/api.js"></script>
    <script src="../../../shared/js/navigation.js"></script>
    <script src="../../../shared/js/shell.js"></script>
    <script src="../../../shared/js/page-router.js"></script>
    <script src="sales.js"></script>
</body>
</html>
