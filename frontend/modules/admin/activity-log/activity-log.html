<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <link rel="stylesheet" href="../../../shared/css/base.css">
    <link rel="stylesheet" href="../../../shared/css/shell.css">
    <title>Activity log | Supply Chain Management System</title>
</head>
<body>
    <div id="shell"></div>

    <main class="page">
        <h1 class="page-title">Activity log</h1>
        <p class="page-description">What was done in your organisation, by whom, and when.</p>

        <section class="page-section">
            <div class="form-grid">
                <div class="form-group">
                    <label for="filterUser">User</label>
                    <select id="filterUser"></select>
                </div>

                <div class="form-group">
                    <label for="filterAction">Action</label>
                    <select id="filterAction"></select>
                </div>

                <div class="form-group">
                    <label for="filterFrom">From date</label>
                    <input type="date" id="filterFrom">
                </div>

                <div class="form-group">
                    <label for="filterTo">To date</label>
                    <input type="date" id="filterTo">
                </div>
            </div>
        </section>

        <section class="page-section">
            <div id="logMessage" class="form-message" role="alert" aria-live="polite"></div>

            <div class="record-bar">
                <div class="form-group">
                    <label for="entrySelect">Select an entry</label>
                    <select id="entrySelect"></select>
                    <p class="field-hint" id="logNote"></p>
                </div>
            </div>

            <dl class="detail-list" id="entryDetail"></dl>
        </section>
    </main>

    <script src="../../../shared/js/api.js"></script>
    <script src="../../../shared/js/form-helpers.js"></script>
    <script src="../../../shared/js/navigation.js"></script>
    <script src="../../../shared/js/shell.js"></script>
    <script src="activity-log.js"></script>
</body>
</html>
