<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <link rel="stylesheet" href="../shared/css/base.css">
    <link rel="stylesheet" href="../shared/css/shell.css">
    <link rel="stylesheet" href="auth.css">
    <title>Sign in | Supply Chain Management System</title>
</head>
<body>
    <header class="shell-main-row">
        <div class="shell-brand">Supply Chain Management System</div>
        <a class="shell-tab auth-switch" href="register.html">Register an organisation</a>
    </header>

    <main class="page">
        <h1 class="page-title">Sign in</h1>
        <p class="page-description">Use the email and password of your organisation account.</p>

        <section class="page-section">
            <form id="loginForm" class="auth-form" novalidate>
                <div class="form-group">
                    <label for="email">Email</label>
                    <input type="email" id="email" autocomplete="username" autofocus>
                </div>

                <div class="form-group">
                    <label for="password">Password</label>
                    <div class="input-wrap">
                        <input type="password" id="password" autocomplete="current-password">
                        <button type="button" class="toggle-password" data-target="password" aria-pressed="false">Show</button>
                    </div>
                </div>

                <div id="formMessage" class="form-message" role="alert" aria-live="polite"></div>

                <div class="form-actions">
                    <button type="submit" class="primary-button" id="loginButton">Sign in</button>
                </div>
            </form>
        </section>
    </main>

    <script src="../shared/js/api.js"></script>
    <script src="../shared/js/form-helpers.js"></script>
    <script src="login.js"></script>
</body>
</html>
