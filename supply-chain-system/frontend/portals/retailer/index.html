<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Retailer Portal | SupplyChain Management System</title>
    <link rel="stylesheet" href="../portal-home.css">
</head>
<body data-portal="retailer">
    <header class="portal-header">
        <div class="portal-brand">SUPPLYCHAIN MANAGEMENT SYSTEM</div>
        <button type="button" class="portal-signout" id="signOutButton">Sign out</button>
    </header>

    <main class="portal-main portal-content">
        <h1>Retailer Portal</h1>
        <p class="portal-welcome" id="welcomeText"></p>

        <dl class="portal-details">
            <dt>Organization</dt>
            <dd id="organizationName"></dd>
            <dt>Organization type</dt>
            <dd id="organizationType"></dd>
            <dt>Signed in user</dt>
            <dd id="userName"></dd>
            <dt>Role</dt>
            <dd id="userRole"></dd>
            <dt>Branch</dt>
            <dd id="branchName"></dd>
        </dl>
    </main>

    <script src="../portal-home.js"></script>
</body>
</html>
