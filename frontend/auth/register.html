<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Register Organization | Supply Chain Management System</title>
    <link rel="stylesheet" href="../shared/css/base.css">
    <link rel="stylesheet" href="auth.css">
</head>
<body>
    <header class="top-header">
        <div class="system-name">SUPPLY CHAIN MANAGEMENT SYSTEM</div>
        <a href="login.html" class="header-link">Sign in</a>
    </header>

    <main class="auth-panel auth-panel--wide">
        <h1>Register Organization</h1>
        <p class="auth-intro">Create your organization, its main branch and the administrator account.</p>

        <form id="registerForm" class="auth-form" novalidate>

            <div class="form-section">
                <h2>Organization Details</h2>

                <div class="form-group">
                    <label for="organizationName">Organization Name</label>
                    <input type="text" id="organizationName" name="organizationName" maxlength="150" autocomplete="organization" required>
                </div>

                <div class="form-group">
                    <label for="organizationType">Organization Type</label>
                    <select id="organizationType" name="organizationType" required>
                        <option value="">Select organization type</option>
                        <option value="MANUFACTURER">Manufacturer</option>
                        <option value="SUPPLIER">Supplier</option>
                        <option value="MANUFACTURER_SUPPLIER">Manufacturer + Supplier</option>
                        <option value="RETAILER">Retailer</option>
                    </select>
                </div>

                <div class="form-row">
                    <div class="form-group">
                        <label for="kraPin">KRA PIN <span class="optional">(optional)</span></label>
                        <input type="text" id="kraPin" name="kraPin" maxlength="30" placeholder="A123456789Z" autocomplete="off">
                    </div>

                    <div class="form-group">
                        <label for="organizationEmail">Organization Email <span class="optional">(optional)</span></label>
                        <input type="email" id="organizationEmail" name="organizationEmail" maxlength="150" autocomplete="off">
                    </div>
                </div>

                <div class="form-row">
                    <div class="form-group">
                        <label for="organizationPhone">Phone Number <span class="optional">(optional)</span></label>
                        <input type="tel" id="organizationPhone" name="organizationPhone" maxlength="30" placeholder="+254 700 000 000" autocomplete="tel">
                    </div>

                    <div class="form-group">
                        <label for="organizationAddress">Address <span class="optional">(optional)</span></label>
                        <input type="text" id="organizationAddress" name="organizationAddress" maxlength="255" autocomplete="street-address">
                    </div>
                </div>
            </div>

            <div class="form-section">
                <h2>Main Branch</h2>

                <div class="form-row">
                    <div class="form-group">
                        <label for="branchName">Branch Name</label>
                        <input type="text" id="branchName" name="branchName" maxlength="150" autocomplete="off" required>
                    </div>

                    <div class="form-group">
                        <label for="branchLocation">Location</label>
                        <input type="text" id="branchLocation" name="branchLocation" maxlength="255" autocomplete="off" required>
                    </div>
                </div>
            </div>

            <div class="form-section">
                <h2>Administrator Account</h2>

                <div class="form-row">
                    <div class="form-group">
                        <label for="firstName">First Name</label>
                        <input type="text" id="firstName" name="firstName" maxlength="100" autocomplete="given-name" required>
                    </div>

                    <div class="form-group">
                        <label for="lastName">Last Name</label>
                        <input type="text" id="lastName" name="lastName" maxlength="100" autocomplete="family-name" required>
                    </div>
                </div>

                <div class="form-group">
                    <label for="adminEmail">Administrator Email</label>
                    <input type="email" id="adminEmail" name="adminEmail" maxlength="150" autocomplete="email" required>
                </div>

                <div class="form-row">
                    <div class="form-group">
                        <label for="password">Password</label>
                        <div class="input-wrap">
                            <input type="password" id="password" name="password" autocomplete="new-password" required>
                            <button type="button" class="toggle-password" data-target="password" aria-pressed="false">Show</button>
                        </div>
                        <p class="field-hint" id="passwordHint">At least 8 characters, with a letter and a number.</p>
                    </div>

                    <div class="form-group">
                        <label for="confirmPassword">Confirm Password</label>
                        <div class="input-wrap">
                            <input type="password" id="confirmPassword" name="confirmPassword" autocomplete="new-password" required>
                            <button type="button" class="toggle-password" data-target="confirmPassword" aria-pressed="false">Show</button>
                        </div>
                    </div>
                </div>
            </div>

            <div id="formMessage" class="form-message" role="alert" aria-live="polite"></div>

            <button type="submit" class="primary-button" id="registerButton">Create Organization</button>

            <p class="bottom-text">
                Already have an organization account?
                <a href="login.html">Sign in</a>
            </p>
        </form>
    </main>

    <script src="../shared/js/api.js"></script>
    <script src="../shared/js/form-helpers.js"></script>
    <script src="register.js"></script>
</body>
</html>
