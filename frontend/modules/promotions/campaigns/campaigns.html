<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="../../../shared/css/base.css">
    <link rel="stylesheet" href="../../../shared/css/shell.css">
    <link rel="stylesheet" href="campaigns.css">
    <title>Promotions | ChainBridge</title>
</head>
<body>
    <div id="shell"></div>
    <main class="page campaigns-page" aria-label="Promotions">
        <div class="campaign-toolbar" aria-label="Campaign controls">
            <div class="pricing-field campaign-picker">
                <label for="campaignSelect">Campaign</label>
                <select id="campaignSelect" disabled></select>
            </div>
            <div class="campaign-toolbar-actions">
                <button id="campaignRefresh" class="secondary-button" type="button">Refresh</button>
                <button id="campaignNew" class="primary-button" type="button" disabled>New campaign</button>
            </div>
        </div>

        <p class="pricing-status" id="campaignStatus" role="status" aria-live="polite" hidden></p>

        <div id="campaignContent" class="campaign-content" aria-live="polite">
            <p class="pricing-empty-text">Loadingâ€¦</p>
        </div>

        <dialog id="campaignDialog" class="campaign-dialog">
            <div id="campaignDialogContent" class="campaign-dialog-content"></div>
        </dialog>
    </main>
    <script src="../../../shared/js/api.js"></script>
    <script src="../../../shared/js/navigation.js"></script>
    <script src="../../../shared/js/shell.js"></script>
    <script src="../../../shared/js/page-router.js"></script>
    <script src="campaigns.js"></script>
</body>
</html>
