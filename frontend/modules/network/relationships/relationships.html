<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <link rel="stylesheet" href="../../../shared/css/base.css">
    <link rel="stylesheet" href="../../../shared/css/shell.css">
    <title>Relationships | Supply Chain Management System</title>
</head>
<body>
    <div id="shell"></div>

    <main class="page">
        <h1 class="page-title">Network</h1>

        <section class="page-section">
            <div id="relationshipMessage" class="form-message" role="alert" aria-live="polite"></div>

            <div class="record-bar">
                <div class="form-group">
                    <label for="relationshipSelect">My Network  </label>
                    <select id="relationshipSelect"></select>
                </div>
            </div>

            <dl class="detail-list" id="relationshipDetail"></dl>

            <div class="form-actions" id="relationshipActions" hidden>
                <button type="button" class="primary-button" id="acceptButton">Accept</button>
                <button type="button" class="primary-button" id="declineButton">Decline</button>
                <button type="button" class="primary-button" id="endButton"></button>
            </div>
        </section>

        <section class="page-section">
            <h2 class="section-title">Connect with an organisation</h2>

            <form id="connectForm" novalidate>
                <div class="form-grid">
                    <div class="form-group">
                        <label for="term">Search Name or KRA PIN</label>
                        <input type="text" id="term" maxlength="150" autocomplete="off">
                        <input type="hidden" id="partnerId">
                        <p class="field-hint" id="foundOrganisation"></p>
                    </div>

                    <div class="form-group">
                        <label for="direction">Who supplies whom</label>
                        <select id="direction">
                            <option value="THEY_SUPPLY_ME">They supply me</option>
                            <option value="I_SUPPLY_THEM">I supply them</option>
                        </select>
                    </div>
                </div>

                <div id="connectMessage" class="form-message" role="alert" aria-live="polite"></div>

                <div class="form-actions">
                    <button type="button" class="primary-button" id="findButton">Find organisation</button>
                    <button type="submit" class="primary-button" id="requestButton">Send request</button>
                </div>
            </form>
        </section>
    </main>

    <script src="../../../shared/js/api.js"></script>
    <script src="../../../shared/js/form-helpers.js"></script>
    <script src="../../../shared/js/navigation.js"></script>
    <script src="../../../shared/js/shell.js"></script>
    <script src="relationships.js"></script>
</body>
</html>
