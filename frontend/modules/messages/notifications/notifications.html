<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="../../../shared/css/base.css">
    <link rel="stylesheet" href="../../../shared/css/shell.css">
    <link rel="stylesheet" href="notifications.css">
    <title>Notifications | Nexora MSRC</title>
</head>
<body>
    <div id="shell"></div>

    <main class="page notifications-page">
        <h1 class="page-title">Notifications</h1>
        <p class="notifications-description">
            Product updates, supply changes and other alerts relevant to your organisation.
        </p>

        <section class="notification-toolbar" aria-label="Notification controls">
            <div class="notification-search">
                <label for="notificationSearch">Search notifications</label>
                <input id="notificationSearch" type="search"
                       placeholder="Search title or message">
            </div>

            <div class="notification-filter">
                <label for="notificationFilter">Show</label>
                <select id="notificationFilter">
                    <option value="ALL">All notifications</option>
                    <option value="UNREAD">Unread only</option>
                    <option value="READ">Read only</option>
                </select>
            </div>

            <button id="refreshNotifications" type="button" class="secondary-button">
                Refresh
            </button>
        </section>

        <p id="notificationStatus" class="notification-status"
           role="status" aria-live="polite">Loading notifications...</p>
        <section id="notificationList" class="notification-list"
                 aria-label="Your notifications"></section>
    </main>

    <script src="../../../shared/js/api.js"></script>
    <script src="../../../shared/js/navigation.js"></script>
    <script src="../../../shared/js/shell.js"></script>
    <script src="notifications.js"></script>
</body>
</html>
