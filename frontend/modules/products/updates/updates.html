<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <link rel="stylesheet" href="../../../shared/css/base.css">
    <link rel="stylesheet" href="../../../shared/css/shell.css">
    <link rel="stylesheet" href="updates.css">
    <title>Updates | Supply Chain Management System</title>
</head>
<body>
    <div id="shell"></div>

    <main class="page updates-page">
        <h1 class="page-title">Updates</h1>

        <section class="page-section">
            <div id="changeMessage" class="form-message" role="alert" aria-live="polite"></div>

            <div class="record-bar">
                <div class="form-group">
                    <label for="changeSelect">Select a change</label>
                    <select id="changeSelect"></select>
                </div>
            </div>

            <dl class="detail-list" id="changeDetail"></dl>

            <div class="form-actions" id="changeActions" hidden>
                <button type="button" class="primary-button" id="actionButton"></button>
            </div>

            <p class="field-hint" id="actionNote"></p>
        </section>
                <section class="page-section" id="threadSection" hidden>
            <h2 class="section-title">Discussion about this change</h2>

            <div class="thread" id="threadLog" role="log" aria-live="polite"></div>

            <form id="messageForm" novalidate>
                <div class="form-group">
                    <label for="text">Message</label>
                    <input type="text" id="text" maxlength="2000" autocomplete="off">
                </div>

                <div id="messageMessage" class="form-message" role="alert" aria-live="polite"></div>

                <div class="form-actions">
                    <button type="submit" class="primary-button" id="sendButton">Send</button>
                </div>
            </form>
        </section>

        <section class="page-section" id="prepareSection" hidden>
            <h2 class="section-title">Prepare a change</h2>

            <form id="prepareForm" novalidate>
                <div class="form-grid">
                    <div class="form-group">
                        <label for="productId">Product</label>
                        <select id="productId"></select>
                    </div>

                    <div class="form-group">
                        <label for="changeType">Change type</label>
                        <select id="changeType">
                            <option value="BARCODE_CHANGE">Barcode change</option>
                            <option value="PACKAGING_CHANGE">Packaging change</option>
                            <option value="PRODUCT_INFORMATION_CHANGE">Product information change</option>
                        </select>
                    </div>

                    <div class="form-group">
                        <label for="barcode">New barcode</label>
                        <input type="text" id="barcode" maxlength="14" inputmode="numeric">
                    </div>

                    <div class="form-group">
                        <label for="packSize">New pack size <span class="optional">(optional)</span></label>
                        <input type="text" id="packSize" maxlength="100">
                    </div>

                    <div class="form-group">
                        <label for="packaging">New packaging <span class="optional">(optional)</span></label>
                        <input type="text" id="packaging" maxlength="255">
                    </div>

                    <div class="form-group">
                        <label for="effectiveDate">Effective date</label>
                        <input type="date" id="effectiveDate">
                    </div>

                    <div class="form-group">
                        <label for="reason">Reason</label>
                        <input type="text" id="reason" maxlength="1000">
                    </div>
                </div>

                <div id="formMessage" class="form-message" role="alert" aria-live="polite"></div>

                <div class="form-actions">
                    <button type="submit" class="primary-button" id="saveButton">Submit for approval</button>
                </div>
            </form>
        </section>
    </main>

    <script src="../../../shared/js/api.js"></script>
    <script src="../../../shared/js/form-helpers.js"></script>
    <script src="../../../shared/js/navigation.js"></script>
    <script src="../../../shared/js/shell.js"></script>
    <script src="updates.js"></script>
</body>
</html>
